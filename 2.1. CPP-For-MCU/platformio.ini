[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Скорость монитора порта (должна совпадать с Serial.begin в коде)
monitor_speed = 115200
; Скорость прошивки (стандартная, безопасная)
upload_speed = 115200

; Флаги сборки для ESP32-S3 (включают нативный USB для Serial Monitor)
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Аппаратные сигналы готовности порта (очень важны для Linux)
monitor_dtr = 1
monitor_rts = 1